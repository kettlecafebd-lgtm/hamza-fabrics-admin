server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Product / hero images proxied from the backend.
    # Without an explicit Cache-Control every page load re-downloads them,
    # which shows up as uncached egress + zero CDN hit-rate.
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    # GeoJSON is the map payload. It is ~425 KB after simplification and must
    # never be re-downloaded on navigation.
    location = /bangladesh.geojson {
        default_type application/geo+json;
        gzip on;
        gzip_types application/geo+json;
        gzip_min_length 1000;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|geojson)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
